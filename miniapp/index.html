<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kokoro Reader</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px system-ui, sans-serif; margin: 0; padding: 16px; max-width: 640px; margin-inline: auto; }
  h1 { font-size: 1.2rem; }
  label, select, button, textarea, input { display: block; width: 100%; box-sizing: border-box; margin: 8px 0; font: inherit; }
  textarea { height: 9rem; padding: 8px; }
  button { padding: 12px; border-radius: 10px; border: 0; background: #2481cc; color: #fff; }
  button:disabled { opacity: .5; }
  pre { white-space: pre-wrap; font-size: .85rem; opacity: .8; }
  progress { width: 100%; }
  #reader { max-height: 40vh; overflow-y: auto; margin: 12px 0; padding: 8px; border: 1px solid #8884; border-radius: 10px; line-height: 1.6; }
  #reader span { cursor: pointer; border-radius: 4px; }
  #reader .read { opacity: .5; }
  #reader .cur { background: #ffd54a; color: #000; opacity: 1; }
</style>
</head>
<body>
<h1>Kokoro Reader <small>(runs on your device)</small></h1>

<label>Text file (.txt / .md / .pdf)
  <input id="file" type="file" accept=".txt,.md,.pdf,text/plain,application/pdf">
</label>
<textarea id="text" placeholder="…or paste text here">Good morning. This speech is generated entirely on your own device, with no server involved.</textarea>

<label>Voice
  <select id="voice">
    <option value="af_heart">af_heart (US, female)</option>
    <option value="af_bella">af_bella (US, female)</option>
    <option value="am_michael">am_michael (US, male)</option>
    <option value="bf_emma">bf_emma (UK, female)</option>
    <option value="bm_george">bm_george (UK, male)</option>
  </select>
</label>

<label>Backend (use WASM if WebGPU sounds garbled)
  <select id="backend">
    <option value="webgpu">WebGPU, fp32 (fast; default on desktop)</option>
    <option value="wasm">WASM, q8 (safe, slower; default on phones)</option>
  </select>
</label>

<label>Pause at line breaks (seconds; blank line = double)
  <input id="pause" type="number" min="0" max="5" step="0.1" value="0.7">
</label>

<button id="go">Generate</button>
<progress id="bar" value="0" max="1" hidden></progress>
<pre id="log"></pre>
<audio id="player" controls hidden></audio>
<div id="reader" hidden></div>
<a id="dl" download="speech.wav" hidden>Download WAV</a>

<script type="module">
import { KokoroTTS } from "https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js";

const $ = id => document.getElementById(id);
const log = m => { $("log").textContent += m + "\n"; };
window.Telegram?.WebApp?.ready();

// PDF text: group items into lines by y position, join wrapped lines, and treat
// a vertical gap bigger than a normal line spacing as a paragraph break.
async function pdfText(file) {
  const pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
  const pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const items = (await (await pdf.getPage(n)).getTextContent()).items.filter(i => i.str !== undefined);
    const lines = [];
    for (const it of items) {
      const y = it.transform[5], h = it.height || Math.abs(it.transform[3]) || 10;
      const last = lines[lines.length - 1];
      if (last && Math.abs(last.y - y) < h * 0.5) last.s += it.str;
      else lines.push({ y, h, s: it.str });
    }
    const real = lines.filter(l => l.s.trim());
    if (!real.length) continue;
    // headings: "Chapter 1", numbered titles, ALL CAPS, or short lines in a larger font
    const hs = real.map(l => l.h).sort((a, b) => a - b), body = hs[Math.floor(hs.length / 2)];
    const lens = real.map(l => l.s.trim().length).sort((a, b) => a - b), typical = lens[Math.floor(lens.length / 2)];
    for (const l of real) {
      const t = l.s.trim();
      l.heading = t.length <= 80 && (
        (/^(chapter|part|book|section|prologue|epilogue|appendix|introduction|preface|contents)\b/i.test(t) && t.length < 60) ||
        /^\d+(\.\d+)*\.?\s+\S/.test(t) && t.length < 60 && !/[.!?,;:]$/.test(t) ||
        (t === t.toUpperCase() && /[A-Z]{3}/.test(t)) ||
        (!/[.!?,;:-]$/.test(t) && t.length < 50 && (l.h > body * 1.15 || t.length < typical * 0.5) && /^[A-Z]/.test(t))
      );
    }
    const gaps = real.slice(1).map((l, i) => Math.abs(real[i].y - l.y)).sort((a, b) => a - b);
    // lower quartile ~ ordinary line spacing; paragraph gaps are the larger minority
    const normal = gaps.length ? gaps[Math.floor(gaps.length / 4)] : 0;
    let out = "", prev = null;
    for (const l of real) {
      let t = l.s.trim();
      if (prev !== null) {
        const gap = Math.abs(prev.y - l.y);
        if (l.heading || prev.heading) out += "\n\n";
        else if (normal && gap > normal * 1.4) out += "\n";
        else if (out.endsWith("-") && /^[a-z]/.test(t)) out = out.slice(0, -1);
        else out += " ";
      }
      out += t; prev = l;
    }
    pages.push(out);
  }
  if (!pages.length) throw new Error("No text found. It may be a scanned PDF (images only).");
  return pages.join("\n\n");
}

$("file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    $("text").value = /\.pdf$/i.test(f.name) || f.type === "application/pdf"
      ? (log("Reading PDF…"), await pdfText(f)) : await f.text();
  } catch (err) { log("Could not read file: " + err.message); }
};

// Default backend: WebGPU on desktop when an adapter exists, WASM on phones
// (WebGPU fp32 produced garbled audio on a phone). A manual choice is remembered.
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const isMobile = navigator.userAgentData?.mobile ?? /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
(async () => {
  const sel = $("backend");
  let gpu = false;
  try { gpu = !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch {}
  if (!gpu) sel.querySelector('[value="webgpu"]').disabled = true;
  const saved = store.get("backend");
  sel.value = saved === "wasm" || (saved === "webgpu" && gpu) ? saved : (gpu && !isMobile ? "webgpu" : "wasm");
})();
$("backend").onchange = e => store.set("backend", e.target.value);

let tts, ttsKey;
async function load() {
  const mode = $("backend").value;
  if (mode === "webgpu" && !navigator.gpu) throw new Error("WebGPU is not available on this device.");
  if (tts && ttsKey === mode) return tts;
  const load1 = m => {
    const opts = m === "webgpu" ? { dtype: "fp32", device: "webgpu" } : { dtype: "q8", device: "wasm" };
    log(`Loading model with ${opts.device}/${opts.dtype} (first run downloads it)…`);
    return KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", opts);
  };
  try {
    tts = await load1(mode); ttsKey = mode;
  } catch (e) {
    if (mode !== "webgpu") throw e;
    log("WebGPU failed (" + e.message + "), falling back to WASM.");
    $("backend").value = "wasm";
    tts = await load1("wasm"); ttsKey = "wasm";
  }
  return tts;
}

// Returns [{ text, pause }]: pause is a multiplier of the base pause that
// follows this chunk (1 after a line break, 2 after a blank line, 0 mid-line).
// Kokoro treats ":" as a long pause, so times become "7 30" (read "seven thirty"); a bare "St."
// is read "sent", so "Elm St. near" becomes "Elm Street" and "St. Louis" becomes "Saint Louis".
function normalize(text) {
  text = text
    .replace(/\b([A-Z][a-z]+) St\.(?=[ \t]*$)/gm, "$1 Street.")
    .replace(/\b([A-Z][a-z]+) St\.(?=\s+[a-z]|[,;:!?)])/g, "$1 Street")
    .replace(/\bSt\.\s+(?=[A-Z])/g, "Saint ");
  return text.replace(/(?<![\d:.])(\d{1,2}):([0-5]\d)(?![\d:])/g, (_, h, m) =>
    m === "00" ? `${h} o'clock` : m[0] === "0" ? `${h} oh ${+m}` : `${h} ${m}`);
}

function sentences(text) {
  const out = [];
  const lines = normalize(text).replace(/\r\n?/g, "\n").split("\n");
  let blank = 0;
  const flush = (cur, last) => { if (cur.trim()) out.push({ text: cur, pause: 0 }); };
  for (const line of lines) {
    if (!line.trim()) { blank++; continue; }
    if (out.length) out[out.length - 1].pause = blank ? 2 : 1;
    blank = 0;
    const parts = line.replace(/\s+/g, " ").match(/[^.!?]+[.!?]*\s*/g) || [];
    let cur = "";
    for (const p of parts) {
      if ((cur + p).length > 300 && cur) { flush(cur); cur = p; } else cur += p;
    }
    flush(cur);
  }
  return out;
}

function wavBlob(chunks, sr) {
  const n = chunks.reduce((a, c) => a + c.length, 0);
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const s = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  s(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); s(8, "WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  s(36, "data"); v.setUint32(40, n * 2, true);
  let o = 44;
  for (const c of chunks) for (let i = 0; i < c.length; i++, o += 2)
    v.setInt16(o, Math.max(-1, Math.min(1, c[i])) * 32767, true);
  return new Blob([buf], { type: "audio/wav" });
}

// Highlight the sentence being spoken, dim what was already read, click to jump.
let readerSpans = [], readerStarts = [], readerCur = -1;
function buildReader(parts, marks, sr) {
  const box = $("reader"); box.replaceChildren();
  readerSpans = parts.map((p, i) => {
    const s = document.createElement("span");
    s.textContent = p.text.trim() + " ";
    s.onclick = () => { $("player").currentTime = readerStarts[i]; $("player").play().catch(() => {}); };
    box.append(s);
    if (p.pause) box.append(document.createElement("br"));
    if (p.pause > 1) box.append(document.createElement("br"));
    return s;
  });
  readerStarts = marks.map(m => m.start / sr);
  readerCur = -1; box.hidden = false;
}
function syncReader() {
  const t = $("player").currentTime;
  let i = readerStarts.length - 1;
  while (i > 0 && readerStarts[i] > t + 0.05) i--;
  if (i === readerCur) return;
  readerCur = i;
  readerSpans.forEach((s, k) => { s.className = k < i ? "read" : k === i ? "cur" : ""; });
  readerSpans[i]?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
$("player").addEventListener("timeupdate", syncReader);
$("player").addEventListener("seeked", syncReader);
$("player").addEventListener("play", syncReader);

$("go").onclick = async () => {
  $("go").disabled = true; $("log").textContent = "";
  try {
    const model = await load();
    const parts = sentences($("text").value);
    const bar = $("bar"); bar.hidden = false; bar.max = parts.length; bar.value = 0;
    const chunks = []; let sr = 24000; const t0 = performance.now();
    const pauseSec = parseFloat($("pause").value) || 0;
    let samples = 0; const marks = []; // marks[i] = { start, end } in samples of sentence i
    for (const p of parts) {
      const a = await model.generate(p.text, { voice: $("voice").value });
      chunks.push(a.audio); sr = a.sampling_rate; bar.value++;
      marks.push({ start: samples, end: samples + a.audio.length });
      samples += a.audio.length;
      if (p.pause && pauseSec) {
        const gap = Math.round(sr * pauseSec * p.pause);
        chunks.push(new Float32Array(gap)); samples += gap;
      }
    }
    buildReader(parts, marks, sr);
    const secs = chunks.reduce((a, c) => a + c.length, 0) / sr;
    const took = (performance.now() - t0) / 1000;
    log(`${secs.toFixed(1)}s of audio in ${took.toFixed(1)}s (${(secs / took).toFixed(1)}x real time)`);
    const url = URL.createObjectURL(wavBlob(chunks, sr));
    $("player").src = url; $("player").hidden = false;
    $("dl").href = url; $("dl").hidden = false;
    $("player").currentTime = 0; syncReader(); // ready and highlighted at the start; the user presses play
  } catch (e) { log("Error: " + e.message); }
  $("go").disabled = false;
};
</script>
</body>
</html>
