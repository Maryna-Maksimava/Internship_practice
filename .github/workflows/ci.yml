name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies (no model, no Telegram needed)
        run: pip install pytest pypdf fpdf2
      - name: Syntax check
        run: python -m compileall -q bot demo experiments
      - name: Tests (the model smoke test is skipped here: no model files)
        run: python -m pytest tests -v

  miniapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mini App text-logic tests
        run: node tests/miniapp.test.mjs
